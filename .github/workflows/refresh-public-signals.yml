# Discogs marketplace-price aggregation retired pending explicit rights review.
# No scheduled jobs or permissions; API marketplace data may be Restricted Data.
name: Archived market-price collector
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archived:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Marketplace pricing integration disabled pending source permission."
